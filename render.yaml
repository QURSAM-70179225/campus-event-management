# Render Blueprint — FREE backend web service.
# Data lives in Turso (hosted SQLite), not on Render's disk: the free plan's
# filesystem is wiped on every restart/spin-down. See documentation/DEPLOYMENT.md.
services:
  - type: web
    name: campus-events-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.14.0"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: APP_TIMEZONE
        value: Asia/Karachi
      - key: SEED_SAMPLE_DATA
        value: "false"
      - key: TURSO_DATABASE_URL
        sync: false # libsql://... from the Turso dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false # database token from the Turso dashboard
      - key: CLIENT_ORIGIN
        sync: false # your Vercel URL, e.g. https://uol-campus-events.vercel.app
